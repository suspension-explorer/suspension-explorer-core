# Illustrative layout, not measured team hardpoints. See README.md for sources.
# X forward, Y left, Z up; the right corner mirrors the left across Y = 0.
# pushrod_* and pushrod_rocker also represent pullrods in the kinematic schema.
# Wheel, steering, vehicle, and setup values match the F1-Style pushrod baseline.
# Separate rocker pickup stations; translate paired mounts along the X axis.
type: double_wishbone
scope: axle
name: F1-Style [Pullrod / Horizontal Rockers / T-Bar ARB / Heave Link]
version: 0.0.1
units: millimeters
vehicle_config:
  cg_position:
    x: 1250
    y: 0
    z: 450
  wheelbase: 2500.0
  front_brake_bias: 0.6
  driven_axle: rear
axle_config:
  axle_position: front
  steering:
    type: rack
  actuation:
    type: pushrod_rocker
    mount: upper_wishbone
  spring:
    type: torsion_bar
  damper:
    type: linear
  anti_roll:
    type: t_bar
  heave_link:
    type: rocker_to_rocker
  wheel:
    offset: 0
    tire:
      aspect_ratio: 0.55
      section_width: 270
      rim_diameter: 13
  left_setup:
