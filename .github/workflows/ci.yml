name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel outdated runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  core-boundary:
    name: Core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just install-core-ci
      - run: just test-core

  capability-manifest:
    name: Capability manifest (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
      - run: uv venv /tmp/manifest-env
      - run: uv pip install --python /tmp/manifest-env/bin/python dist/*.whl
      - name: Generate outside the source checkout
        run: |
          cd /tmp
          /tmp/manifest-env/bin/python -m kinematics.core.capabilities --out "$GITHUB_WORKSPACE/dist/capabilities.json" --schema-out "$GITHUB_WORKSPACE/dist/capabilities.json.schema.json"
      - uses: actions/upload-artifact@v4
        with:
          name: core-capabilities
          path: dist/capabilities*.json

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just install-ci
      - run: just format-check

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just install-ci
      - run: just spellcheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just install-ci
      - run: just lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just install-ci
      - run: just type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just install-ci
      - run: just test
