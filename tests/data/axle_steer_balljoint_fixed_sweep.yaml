version: 1
steps: 41
targets:
  # Holding one coordinate on each lower ball joint fixes the wishbone bump
  # degrees of freedom without constraining a point carried by the upright away
  # from the physical steering axis.
  - type: point
    point: lower_wishbone_outboard
    side: left
    direction: {axis: z}
    hold: true
  - type: point
    point: lower_wishbone_outboard
    side: right
    direction: {axis: z}
    hold: true
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: -50
    stop: 50
