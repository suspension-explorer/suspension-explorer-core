type: trailing_arm
side: left
name: "semi-trailing arm with direct torsion actuation"
version: "0.1.0"
units: millimeters

spring:
  type: torsion_bar

hardpoints:
  trailing_arm_pivot_a: {x: 1000, y: 500, z: 300}
  trailing_arm_pivot_b: {x: 900, y: 700, z: 300}
  trailing_arm_outboard: {x: 500, y: 850, z: 250}
  axle_inboard: {x: 500, y: 800, z: 350}
  axle_outboard: {x: 500, y: 1000, z: 350}
  # Pivot A lies on the transverse bar axis. Arm rotation drives bar
  # twist directly; the physical reaction plate adds no kinematic hardpoint.
  torsion_bar_axis_a: {x: 1000, y: 350, z: 300}
  torsion_bar_axis_b: {x: 1000, y: 650, z: 300}
  # The spring is the torsion bar; this is a separate arm-mounted damper.
  strut_top: {x: 750, y: 650, z: 750}
  strut_bottom: {x: 600, y: 850, z: 350}

config:
  steering:
    type: none
  wheel:
    offset: 0
    tire:
      aspect_ratio: 0.55
      section_width: 270
      rim_diameter: 13
  cg_position: {x: 1250, y: 0, z: 450}
  wheelbase: 2500.0
  axle_position: rear
