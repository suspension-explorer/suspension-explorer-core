type: double_wishbone
scope: axle
name: "test axle rocker with independent dampers"
version: "0.0.1"
units: millimeters

vehicle_config:
  cg_position: {x: 1250, y: 0, z: 450}
  wheelbase: 2500.0

axle_config:
  axle_position: front
  steering:
    type: rack
  actuation:
    type: pushrod_rocker
    # Mounting the pushrod to a wishbone keeps the actuation independent of
    # upright steering. An upright-mounted pushrod away from the kingpin line
    # introduces genuine steering-to-spring coupling.
    mount: upright
  spring:
    type: torsion_bar
  damper:
    type: linear
  anti_roll:
    type: u_bar
  heave_link:
    type: none
  wheel:
    offset: 0
    tire:
      aspect_ratio: 0.55
      section_width: 270
      rim_diameter: 13

hardpoints:
  left:
    lower_wishbone_inboard_front: {x: 250, y: 400, z: 200}
    lower_wishbone_inboard_rear: {x: -250, y: 450, z: 200}
    lower_wishbone_outboard: {x: 0, y: 900, z: 200}
    upper_wishbone_inboard_front: {x: 225, y: 350, z: 500}
    upper_wishbone_inboard_rear: {x: -275, y: 350, z: 500}
    upper_wishbone_outboard: {x: -25, y: 750, z: 500}
    trackrod_inboard: {x: 50, y: 200, z: 250}
    trackrod_outboard: {x: 150, y: 800, z: 275}
    axle_inboard: {x: -20, y: 800, z: 308.426}
    axle_outboard: {x: -20, y: 950, z: 313.426}

    pushrod_outboard: {x: 0, y: 870, z: 240}
    pushrod_inboard: {x: 0, y: 430, z: 480}
    rocker_axis_a: {x: 100, y: 340, z: 450}
    rocker_axis_b: {x: -100, y: 340, z: 450}
    droplink_rocker: {x: 0, y: 250, z: 450}
    damper_chassis: {x: -50, y: 300, z: 300}
    damper_rocker: {x: -50, y: 300, z: 470}
    droplink_u_bar: {x: 80, y: 250, z: 300}

  center:
    arb_u_bar_axis_a: {x: 0, y: 250, z: 300}
    arb_u_bar_axis_b: {x: 0, y: -250, z: 300}
